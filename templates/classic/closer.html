<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Geist';src:url('{{FONT_REGULAR}}');font-weight:400}
body{margin:0}
.s{width:1080px;height:1350px;box-sizing:border-box;background:#FFFFFF;font-family:'Geist',sans-serif;color:#151210;padding:260px 80px 110px 80px;display:flex;flex-direction:column}
h2{margin:0;font-size:84px;line-height:1.08;font-weight:400;letter-spacing:-0.03em}
.sub{margin:40px 0 0 0;font-size:44px;line-height:1.3;letter-spacing:-0.01em}
.plan{margin-top:80px;display:flex;flex-direction:column;gap:22px;font-size:34px;line-height:1.34}
.plan p{margin:0}
.k{color:#888888}
.cta{margin:90px 0 0 0;font-size:40px;line-height:1.3;letter-spacing:-0.01em}
.cta b{font-weight:400;background:#151210;color:#FFFFFF;padding:2px 14px}
.end{margin:auto 0 0 0;font-size:26px;color:#555555;text-align:center}
</style>
</head>
<body>
<div class="s">
<h2>{{HEADLINE}}</h2>
<p class="sub">{{SUBLINE}}</p>
<div class="plan">
<p><span class="k">tonight:</span> {{TONIGHT}}</p>
<p><span class="k">this week:</span> {{THIS_WEEK}}</p>
<p><span class="k">next week:</span> {{NEXT_WEEK}}</p>
</div>
<p class="cta">{{CTA}}</p>
<p class="end">(save this. part 2: {{NEXT_TITLE}})</p>
</div>
</body>
</html>
