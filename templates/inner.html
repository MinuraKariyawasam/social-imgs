<!doctype html><html lang="en"><head><meta charset="utf-8"><style>{{BASE_CSS}}
.big{position:absolute;left:70px;top:90px;width:96px;height:96px;font-size:56px;background:#FDD801;color:#111;border-color:#111}
h2{position:absolute;left:70px;right:70px;top:230px;font-size:100px;line-height:1.18}
.b{position:absolute;left:40px;width:520px;top:600px;margin:0;padding:34px 40px;border:4px dashed rgba(255,255,255,.85);border-radius:18px;font-size:38px;line-height:1.3;font-weight:500}
.who{position:absolute;right:50px;top:700px;width:390px;height:480px;transform:rotate(3deg)}
.lab{position:absolute;right:90px;top:1210px;font-size:24px}
.arr{position:absolute;left:470px;top:1020px;font-size:110px;font-weight:900}
</style></head><body><div class="s">
<!-- TITLE: 2 to 4 words; wrap the one word that matters in <span class="hl">…</span>. LABEL: 1 to 3 word tag under the painting. -->
<div class="num big">{{NUM}}</div>
<h2 class="h">{{TITLE}}</h2>
<p class="b">{{BODY}}</p>
<img class="pic who img" src="{{IMAGE}}" alt="">
<span class="tag lab">{{LABEL}}</span>
<div class="arr">→</div>
</div>
<script>document.fonts.ready.then(()=>{const h=document.querySelector('h2');let f=100;while(h.getBoundingClientRect().bottom>570&&f>64){f-=4;h.style.fontSize=f+'px'}})</script>
</body></html>
