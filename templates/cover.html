<!doctype html><html lang="en"><head><meta charset="utf-8"><style>{{BASE_CSS}}
.head{position:absolute;left:70px;right:70px;top:90px}
.sub{margin:0 0 18px;font-size:40px;font-weight:700;line-height:1.2}
h1{font-size:128px;line-height:.98}
.flow{position:absolute;left:50px;width:620px;top:640px;display:flex;gap:14px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:22px}
.st{width:100%;height:330px;display:flex;justify-content:center;padding-top:30px;box-sizing:border-box}
.st .tag{font-size:17px;padding:6px 8px;text-align:center;line-height:1.1;align-self:flex-start}
.hook{position:absolute;left:70px;bottom:80px;margin:0;font-size:40px;font-weight:700}
.who{position:absolute;right:40px;top:560px;width:330px;height:480px;transform:rotate(4deg)}
</style></head><body><div class="s">
<!-- SUB: the small lowercase lead-in. TITLE: the rest of the title; wrap the one keyword in <span class="y">…</span>. STEPS: one short label per inner slide. -->
<div class="head"><p class="sub">{{SUB}}</p>
<h1 class="h">{{TITLE}}</h1></div>
<div class="flow">{{STEPS}}</div>
<img class="pic who" src="{{IMAGE}}" alt="">
<p class="hook">{{HOOK}}</p>
</div>
<script>document.fonts.ready.then(()=>{
const h=document.querySelector('h1');let f=128;while(h.getBoundingClientRect().bottom>530&&f>64){f-=4;h.style.fontSize=f+'px'}})</script>
</body></html>
