<!doctype html><html lang="en"><head><meta charset="utf-8"><style>{{BASE_CSS}}
h2{position:absolute;left:70px;right:70px;top:140px;font-size:92px;line-height:1.02}
.flow{position:absolute;left:60px;right:60px;top:560px;display:flex;gap:26px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:22px}
.pb{width:100%;height:340px;box-sizing:border-box;padding:30px 22px;text-align:center}
.pb p{margin:28px 0 0;font-size:34px;line-height:1.25;font-weight:700}
.cta{position:absolute;left:50px;right:50px;top:1090px;margin:0;font-size:36px;font-weight:700;text-align:center}
.cta b{display:inline-block;background:#FDD801;color:#111;font-weight:900;text-transform:uppercase;padding:8px 16px;border-radius:6px;font-size:36px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.end{position:absolute;left:0;right:0;bottom:60px;margin:0;text-align:center;font-size:26px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
</style></head><body><div class="s">
<!-- HEADLINE: two lines with <br>; wrap the reframe word(s) in <span class="y">…</span>. CTA: wrap the keyword in <b>…</b>. -->
<h2 class="h">{{HEADLINE}}</h2>
<div class="flow">
<div class="col"><div class="box pb"><span class="tag">tonight</span><p>{{TONIGHT}}</p></div><div class="num">1</div></div>
<div class="col"><div class="box pb"><span class="tag">this week</span><p>{{THIS_WEEK}}</p></div><div class="num">2</div></div>
<div class="col"><div class="box pb"><span class="tag">next week</span><p>{{NEXT_WEEK}}</p></div><div class="num">3</div></div>
</div>
<p class="cta">{{CTA}}</p>
<p class="end">part 2: {{NEXT_TITLE}}</p>
</div>
<script>document.fonts.ready.then(()=>{const h=document.querySelector('h2');let f=92;while(h.getBoundingClientRect().bottom>530&&f>60){f-=4;h.style.fontSize=f+'px'}})</script>
</body></html>
